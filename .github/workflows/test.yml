name: test
on:
  push:
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check game JavaScript syntax
        run: |
          node --check pixel-net-cafe/data.js
          node --check pixel-net-cafe/core.js
          node --check pixel-net-cafe/ui.js
          node --check pixel-net-cafe/sim.js
          node --check pixel-net-cafe/scene.js
      - run: npm test
