<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#120d1a">
<title>像素网吧：夜班经理</title>
<link rel="stylesheet" href="styles.css">

</head>
<body>
<main>
  <div class="top"><div><div class="eyebrow" id="sub">ROGUELITE · 网吧经营</div><h1 class="title" id="title">像素网吧：夜班经理</h1></div><button class="btn mini" id="lang">EN</button></div>
  <section class="stats">
    <div class="stat"><small id="cashL">现金</small><b id="cash">¥700</b></div>
    <div class="stat"><small id="dayL">天数</small><b id="day">1 / 15</b></div>
    <div class="stat"><small id="repL">口碑</small><b id="rep">5</b></div>
    <div class="stat"><small id="costL">日成本</small><b id="cost">¥45</b></div>
  </section>
  <section class="runbar">
    <div class="row"><span><b id="district">大学城</b> · <span id="bossLabel" class="muted">下一场 Boss 夜：第 5 天</span></span><span class="chip" id="flow">0 / 9</span></div>
    <div class="bar"><i id="flowBar"></i></div>
    <div class="row" style="margin-top:7px"><span id="contractText">今日任务：营业额 ¥120</span><span id="contractProgress" class="good">¥0 / ¥120</span></div>
  </section>
  <div id="game"></div>
  <section class="panel">
    <div class="row"><div><div class="eyebrow" id="selL">当前选择</div><b class="sectionTitle" id="selT">空地</b></div><div class="chip" id="seatStatus">EMPTY</div></div>
    <p class="desc" id="desc">购买座位，然后配置电脑。不同顾客会挑不同档位的机器。</p>
    <div class="actions"><button class="btn primary" id="mainBtn">购买座位 ¥110</button><button class="btn" id="shopBtn">电脑商店</button></div>
    <div class="subactions"><button class="btn" id="facilityBtn">设施升级</button><button class="btn" id="promoBtn">今晚促销 ¥30</button></div>
    <div id="shop" style="display:none"></div>
  </section>
  <section class="panel"><div class="row"><b class="sectionTitle" id="logT">营业记录</b><div><button class="btn mini" id="help">玩法</button> <button class="btn mini danger" id="reset">重开</button></div></div><div id="log"></div></section>
  <footer><span id="save">自动保存 · 刷新可继续</span><span id="record">最佳 Day 1</span></footer>
</main>
<div id="overlay"><div class="modal"><div class="eyebrow" id="modalK">事件</div><h2 id="modalT"></h2><div class="body" id="modalB"></div><div class="choices" id="choices"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/phaser@4.2.1/dist/phaser.min.js"></script>
<script src="data.js"></script>
<script src="core.js"></script>
<script src="ui.js"></script>
<script src="sim.js"></script>
<script src="scene.js"></script>
</body>
</html>
